<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>タップマルズ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タップマルズ">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
  background:linear-gradient(160deg,#ffe8f5,#e8f0ff,#e8fff0);
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}

/* Header */
header{
  text-align:center;
  padding:16px 16px 10px;
  background:white;
  border-bottom:5px solid #ffb3d9;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 3px 12px rgba(255,100,180,.15);
}
.title{
  font-size:2.2rem;
  font-weight:900;
  background:linear-gradient(135deg,#ff6ec7,#a855f7,#3b82f6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:.06em;
}
.score-box{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:10px 0 4px;
}
.score-item{
  background:#f5f8ff;
  border-radius:16px;
  padding:7px 18px;
  text-align:center;
  border:3px solid #c7d8ff;
  min-width:100px;
}
.score-label{font-size:.72rem;color:#999;font-weight:700}
.score-val{font-size:1.9rem;font-weight:900;color:#3b82f6;line-height:1.1}
.score-val.green{color:#22c55e}

/* Content */
.content{padding:14px 14px 30px}

/* Start button */
.start-btn{
  display:block;
  width:100%;
  padding:18px;
  background:linear-gradient(135deg,#4ade80,#22c55e);
  border:none;
  border-radius:22px;
  color:white;
  font-size:1.55rem;
  font-weight:900;
  cursor:pointer;
  margin-bottom:14px;
  box-shadow:0 6px 0 #16a34a,0 8px 20px rgba(34,197,94,.35);
  transition:transform .1s,box-shadow .1s;
  font-family:inherit;
  letter-spacing:.07em;
}
.start-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #16a34a}

/* Game area */
.game-area{
  background:linear-gradient(180deg,#e4f3fc,#d8ecf8);
  border-radius:26px;
  border:5px solid #90caf9;
  position:relative;
  width:100%;
  height:1500px;
  overflow:hidden;
  box-shadow:inset 0 3px 12px rgba(144,202,249,.3);
}

/* Animals */
.animal{
  position:absolute;
  font-size:88px;
  line-height:1;
  cursor:pointer;
  touch-action:manipulation;
  display:flex;
  align-items:center;
  justify-content:center;
  width:128px;
  height:128px;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:transform .12s;
}
.animal:active{transform:scale(1.25)}

@keyframes pop-out{
  0%{transform:scale(1);opacity:1}
  35%{transform:scale(1.6);opacity:1}
  100%{transform:scale(0.1);opacity:0}
}
.animal.popping{
  animation:pop-out .42s cubic-bezier(.36,.07,.19,.97) forwards;
  pointer-events:none;
}

/* Instructions */
.instructions{
  background:white;
  border-radius:18px;
  padding:14px 16px;
  margin-top:14px;
  border:3px solid #f0e8ff;
}
.instructions p{
  font-size:.9rem;
  color:#666;
  margin-bottom:7px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  line-height:1.5;
}
.instructions p:last-child{margin-bottom:0}

/* Clear overlay */
.clear-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  align-items:center;
  justify-content:center;
}
.clear-overlay.show{display:flex}

.clear-box{
  background:white;
  border-radius:32px;
  padding:40px 28px;
  text-align:center;
  max-width:310px;
  width:88%;
  border:6px solid #ffd700;
  box-shadow:0 0 50px rgba(255,215,0,.6);
  position:relative;
  z-index:201;
}
.clear-emoji{font-size:5rem;display:block;margin-bottom:14px;animation:bounce-em 0.6s ease infinite alternate}
@keyframes bounce-em{from{transform:scale(1)}to{transform:scale(1.15)}}
.clear-title{font-size:2.2rem;font-weight:900;color:#ff6ec7;margin-bottom:6px}
.clear-sub{font-size:1.05rem;color:#888;margin-bottom:26px;line-height:1.5}

.retry-btn{
  background:linear-gradient(135deg,#f97316,#ef4444);
  color:white;
  border:none;
  border-radius:18px;
  padding:15px 38px;
  font-size:1.3rem;
  font-weight:900;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 5px 0 #b91c1c;
  transition:transform .1s,box-shadow .1s;
}
.retry-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b91c1c}

/* Stars decoration */
.stars-deco{
  position:absolute;
  top:0;left:0;right:0;
  pointer-events:none;
  overflow:hidden;
  height:60px;
}
.star{
  position:absolute;
  font-size:1.4rem;
  animation:star-float 2s ease-in-out infinite alternate;
}
@keyframes star-float{from{transform:translateY(0)}to{transform:translateY(-8px)}}

/* Confetti */
.confetti-piece{
  position:fixed;
  width:11px;
  height:11px;
  border-radius:2px;
  z-index:300;
  pointer-events:none;
}
@keyframes confetti-fall{
  0%{transform:translateY(-30px) rotate(0deg) scale(1);opacity:1}
  100%{transform:translateY(105vh) rotate(780deg) scale(.5);opacity:0}
}
</style>
</head>
<body>

<header>
  <div class="title">🐾 タップマルズ</div>
  <div class="score-box">
    <div class="score-item">
      <div class="score-label">🐾 みつけた</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">ぜんぶで</div>
      <div class="score-val green" id="target">10</div>
    </div>
  </div>
</header>

<div class="content">
  <button class="start-btn" id="start-btn" onclick="startGame()">🎮 はじめる！</button>

  <div class="game-area" id="game-area"></div>

  <div class="instructions" id="instructions">
    <p>🐾 どうぶつを タップすると てんすうが はいるよ！</p>
    <p>📱 スクロールして ぜんぶ みつけてね</p>
    <p>🔄 もういちどボタンで やりなおせるよ</p>
  </div>
</div>

<!-- Clear screen -->
<div class="clear-overlay" id="clear-overlay">
  <div class="clear-box">
    <span class="clear-emoji">🎉</span>
    <div class="clear-title">やったー！</div>
    <div class="clear-sub">ぜんぶ みつけたよ！<br>すごい すごい！</div>
    <button class="retry-btn" onclick="resetGame()">🔄 もういちど</button>
  </div>
</div>

<script>
const ANIMALS = ['🐰','🐱','🐒','🐸','🐧'];
const TOTAL = 10;
let score = 0;

function startGame() {
  score = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('start-btn').textContent = '🔄 もういちど';
  placeAnimals();
}

function resetGame() {
  document.getElementById('clear-overlay').classList.remove('show');
  startGame();
}

function placeAnimals() {
  const area = document.getElementById('game-area');
  area.innerHTML = '';

  const areaW = area.clientWidth || 440;
  const areaH = 1500;
  const size = 128;
  const margin = 16;
  const placed = [];

  // 2 of each animal, shuffled
  const list = [];
  for (let i = 0; i < TOTAL; i++) list.push(ANIMALS[i % ANIMALS.length]);
  list.sort(() => Math.random() - .5);

  for (const emoji of list) {
    let x, y, ok = false, attempts = 0;
    while (!ok && attempts < 300) {
      x = margin + Math.random() * (areaW - size - margin * 2);
      y = margin + Math.random() * (areaH - size - margin * 2);
      ok = placed.every(p => Math.abs(p.x - x) > size + 8 || Math.abs(p.y - y) > size + 8);
      attempts++;
    }
    placed.push({x, y});

    const el = document.createElement('div');
    el.className = 'animal';
    el.textContent = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const tap = () => tapAnimal(el);
    el.addEventListener('click', tap);
    el.addEventListener('touchend', e => { e.preventDefault(); tap(); });
    area.appendChild(el);
  }
}

function tapAnimal(el) {
  if (el.classList.contains('popping')) return;
  el.classList.add('popping');
  score++;
  document.getElementById('score').textContent = score;
  setTimeout(() => {
    el.remove();
    if (score >= TOTAL) showClear();
  }, 420);
}

function showClear() {
  document.getElementById('clear-overlay').classList.add('show');
  launchConfetti();
}

const COLORS = ['#ff6ec7','#ffd700','#4ade80','#60a5fa','#f97316','#a855f7','#f43f5e','#06b6d4'];

function launchConfetti() {
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        background:${COLORS[Math.floor(Math.random()*COLORS.length)]};
        left:${Math.random()*100}vw;
        top:-30px;
        border-radius:${Math.random()>.5?'50%':'2px'};
        animation:confetti-fall ${1.4+Math.random()*1.8}s ease-in forwards;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }, i * 28);
  }
}
</script>
</body>
</html>
