<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年 年間カレンダー</title>
<style>
  :root {
    --primary:   #2C5F8A;
    --accent:    #E07B39;
    --bg:        #F4F6F9;
    --white:     #FFFFFF;
    --text:      #1E2A35;
    --muted:     #6B7A89;
    --sun-color: #C0392B;
    --sat-color: #2471A3;
    --today-bg:  #E07B39;
    --today-fg:  #FFFFFF;
    --shadow:    0 2px 12px rgba(44,95,138,.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP",
                 "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
  }

  /* ── page header ── */
  .page-header {
    background: var(--primary);
    padding: 28px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-header h1 {
    color: #FFFFFF;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .page-header h1 span {
    color: var(--accent);
    font-size: 32px;
  }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: rgba(255,255,255,.75);
    font-size: 12px;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* ── grid of months ── */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── month card ── */
  .month-card {
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .month-header {
    background: var(--primary);
    color: #FFFFFF;
    text-align: center;
    padding: 9px 0 8px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .08em;
  }
  .month-header small {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .04em;
    opacity: .75;
    margin-left: 4px;
  }

  /* ── day-of-week row ── */
  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #EBF0F6;
  }
  .dow-cell {
    text-align: center;
    padding: 5px 0;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .dow-cell.sun { color: var(--sun-color); }
  .dow-cell.sat { color: var(--sat-color); }

  /* ── dates grid ── */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 6px 4px 8px;
    gap: 2px;
  }
  .day-cell {
    text-align: center;
    padding: 4px 2px;
    font-size: 12px;
    border-radius: 50%;
    line-height: 1.8;
    cursor: default;
    min-width: 22px;
    margin: 0 auto;
  }
  .day-cell.empty { visibility: hidden; }
  .day-cell.sun   { color: var(--sun-color); }
  .day-cell.sat   { color: var(--sat-color); }
  .day-cell.today {
    background: var(--today-bg);
    color: var(--today-fg) !important;
    font-weight: 700;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    line-height: 24px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── footer ── */
  footer {
    background: var(--primary);
    color: rgba(255,255,255,.45);
    text-align: center;
    padding: 18px 16px;
    font-size: 12px;
    letter-spacing: .04em;
    margin-top: 8px;
  }
  footer span { color: var(--accent); }

  @media (max-width: 900px) {
    .calendar-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .calendar-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px; }
  }
  @media (max-width: 400px) {
    .calendar-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1><span>2026</span>年 年間カレンダー</h1>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#C0392B;"></div>日曜日
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#2471A3;"></div>土曜日
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#E07B39;"></div>今日
    </div>
  </div>
</header>

<div class="calendar-grid" id="calendarGrid"></div>

<footer>
  Produced with Claude Code ✦ <span>2026年 年間スケジュール表</span>
</footer>

<script>
  const YEAR = 2026;
  const MONTHS_JP = ["1月","2月","3月","4月","5月","6月",
                     "7月","8月","9月","10月","11月","12月"];
  const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun",
                     "Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOWS = ["日","月","火","水","木","金","土"];

  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth(); // 0-indexed
  const todayD = today.getDate();

  const grid = document.getElementById("calendarGrid");

  for (let m = 0; m < 12; m++) {
    const card = document.createElement("div");
    card.className = "month-card";

    // header
    const hdr = document.createElement("div");
    hdr.className = "month-header";
    hdr.innerHTML = `${MONTHS_JP[m]}<small>${MONTHS_EN[m]}</small>`;
    card.appendChild(hdr);

    // day-of-week header
    const dowRow = document.createElement("div");
    dowRow.className = "dow-row";
    DOWS.forEach((d, i) => {
      const cell = document.createElement("div");
      cell.className = "dow-cell" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
      cell.textContent = d;
      dowRow.appendChild(cell);
    });
    card.appendChild(dowRow);

    // days grid
    const daysGrid = document.createElement("div");
    daysGrid.className = "days-grid";

    const firstDay = new Date(YEAR, m, 1).getDay(); // 0=Sun
    const lastDate = new Date(YEAR, m + 1, 0).getDate();

    // blank cells before the 1st
    for (let blank = 0; blank < firstDay; blank++) {
      const empty = document.createElement("div");
      empty.className = "day-cell empty";
      empty.textContent = "0";
      daysGrid.appendChild(empty);
    }

    for (let d = 1; d <= lastDate; d++) {
      const dayOfWeek = (firstDay + d - 1) % 7;
      const cell = document.createElement("div");
      const isToday = (YEAR === todayY && m === todayM && d === todayD);

      let cls = "day-cell";
      if (dayOfWeek === 0) cls += " sun";
      if (dayOfWeek === 6) cls += " sat";
      if (isToday)         cls += " today";
      cell.className = cls;
      cell.textContent = d;
      daysGrid.appendChild(cell);
    }

    card.appendChild(daysGrid);
    grid.appendChild(card);
  }
</script>
</body>
</html>
