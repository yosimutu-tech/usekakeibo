<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>タップマルズ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タップマルズ">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Hiragino Maru Gothic Pro','Hiragino Sans','Yu Gothic',sans-serif;
  background:#f8f8f8;
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}

/* ========== おやすみ画面 ========== */
.oyasumi-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:white;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 24px 30px;
  overflow:hidden;
}
.oyasumi-screen.show{display:flex}

.oyasumi-card{
  width:100%;
  max-width:340px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.18);
  margin-bottom:28px;
}

.card-sky{
  background:linear-gradient(180deg,#1a3a6a 0%,#1e4880 50%,#1a3a6a 100%);
  padding:20px 20px 0;
  position:relative;
  min-height:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}

.c-star{position:absolute;font-size:1.7rem;animation:star-twinkle 2s ease-in-out infinite alternate;}
.c-heart{position:absolute;font-size:1.1rem;animation:heart-beat 2s ease-in-out infinite alternate;}
.c-cloud{position:absolute;font-size:2.2rem;animation:cloud-drift 5s ease-in-out infinite alternate;filter:hue-rotate(130deg) saturate(0.7) brightness(1.4);}
@keyframes star-twinkle{from{transform:scale(1);opacity:.75}to{transform:scale(1.2);opacity:1}}
@keyframes heart-beat{from{transform:scale(1)}to{transform:scale(1.15)}}
@keyframes cloud-drift{from{transform:translateX(0)}to{transform:translateX(6px)}}

.bunny-wrap{
  position:relative;
  z-index:2;
  width:260px;
  height:150px;
  margin:0 auto -14px;
  animation:float-cloud 3s ease-in-out infinite alternate;
}
@keyframes float-cloud{from{transform:translateY(0)}to{transform:translateY(-8px)}}

.mountains{position:absolute;bottom:0;left:0;right:0;height:80px;overflow:hidden;}
.mt1{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:100px solid #1a4a25;}
.mt2{position:absolute;bottom:0;right:10%;width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:80px solid #163d1f;}

.card-grass{background:linear-gradient(180deg,#1d5a28,#1a5025);padding:14px 16px 18px;text-align:center;position:relative;}
.card-trees{position:absolute;bottom:100%;left:12%;display:flex;gap:6px;font-size:2.2rem;filter:brightness(0.35) saturate(0.3);line-height:1;}
.card-text{color:white;font-size:1.1rem;font-weight:900;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.4);}

.oyasumi-title{font-size:1.9rem;font-weight:900;color:#222;margin-bottom:12px;letter-spacing:.02em;}
.oyasumi-sub{font-size:1.1rem;color:#444;font-weight:600;line-height:1.6;}

/* ========== ヘッダー ========== */
header{text-align:center;padding:14px 16px 8px;background:white;border-bottom:5px solid #ffb3d9;position:sticky;top:0;z-index:50;box-shadow:0 3px 12px rgba(255,100,180,.15);}
.title{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#ff6ec7,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.06em;}
.header-row{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 4px}
.score-item{background:#f5f8ff;border-radius:14px;padding:5px 14px;text-align:center;border:3px solid #c7d8ff;min-width:90px;}
.score-label{font-size:.68rem;color:#999;font-weight:700}
.score-val{font-size:1.7rem;font-weight:900;color:#3b82f6;line-height:1.1}
.timer-box{background:#fff8e8;border-radius:14px;padding:5px 14px;text-align:center;border:3px solid #ffd080;min-width:90px;}
.timer-label{font-size:.68rem;color:#999;font-weight:700}
.timer-val{font-size:1.7rem;font-weight:900;color:#f59e0b;line-height:1.1}
.timer-val.warn{color:#ef4444;animation:blink .5s step-start infinite}
@keyframes blink{50%{opacity:.3}}
.timer-bar-wrap{height:8px;background:#f0f0f0;border-radius:4px;margin:4px 2px 0;overflow:hidden}
.timer-bar{height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#ef4444);border-radius:4px;transition:width 1s linear}

/* ========== コンテンツ ========== */
.content{padding:12px 14px 30px}
.start-btn{display:block;width:100%;padding:17px;background:linear-gradient(135deg,#4ade80,#22c55e);border:none;border-radius:22px;color:white;font-size:1.5rem;font-weight:900;cursor:pointer;margin-bottom:14px;box-shadow:0 6px 0 #16a34a,0 8px 20px rgba(34,197,94,.35);transition:transform .1s,box-shadow .1s;font-family:inherit;letter-spacing:.07em;}
.start-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #16a34a}

.game-area{background:linear-gradient(180deg,#e4f3fc,#d8ecf8);border-radius:26px;border:5px solid #90caf9;position:relative;width:100%;height:1500px;overflow:hidden;box-shadow:inset 0 3px 12px rgba(144,202,249,.3);}
.animal{position:absolute;font-size:88px;line-height:1;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 4px 16px rgba(0,0,0,.12);transition:transform .12s;}
.animal:active{transform:scale(1.25)}
@keyframes pop-out{0%{transform:scale(1);opacity:1}35%{transform:scale(1.6);opacity:1}100%{transform:scale(.1);opacity:0}}
.animal.popping{animation:pop-out .42s cubic-bezier(.36,.07,.19,.97) forwards;pointer-events:none}

.instructions{background:white;border-radius:18px;padding:13px 16px;margin-top:13px;border:3px solid #f0e8ff;}
.instructions p{font-size:.88rem;color:#666;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
.instructions p:last-child{margin-bottom:0}

/* ========== オーバーレイ ========== */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}

/* ========== 時間切れカード ========== */
.end-card{background:white;border-radius:28px;max-width:320px;width:90%;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.35);z-index:201;}
.end-sky{background:linear-gradient(180deg,#1a3a6a,#1e4880);padding:18px 18px 0;position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.end-bunny-wrap{position:relative;width:220px;height:130px;margin:0 auto -8px;animation:float-cloud 3s ease-in-out infinite alternate}
.end-grass{background:linear-gradient(180deg,#1d5a28,#1a5025);padding:12px 16px 16px;text-align:center}
.end-grass-text{color:white;font-size:1.05rem;font-weight:900;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.4);margin-bottom:12px}
.end-bottom{padding:20px 20px 22px;text-align:center;background:white}
.end-title{font-size:1.7rem;font-weight:900;color:#222;margin-bottom:8px}
.end-sub{font-size:.95rem;color:#555;margin-bottom:16px;line-height:1.5}
.end-retry{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:white;border:none;border-radius:16px;padding:12px 32px;font-size:1.1rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #1d4ed8;}
.end-retry:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ed8}
</style>
</head>
<body>

<!-- ========== おやすみ画面 ========== -->
<div class="oyasumi-screen" id="oyasumi-screen">
  <div class="oyasumi-card">
    <div class="card-sky">
      <div class="c-star" style="top:8%;left:12%">⭐</div>
      <div class="c-star" style="top:6%;left:42%;animation-delay:.3s">⭐</div>
      <div class="c-star" style="top:16%;right:14%;animation-delay:.7s;font-size:1.4rem">⭐</div>
      <div class="c-star" style="top:32%;left:8%;animation-delay:.5s;font-size:1.3rem">⭐</div>
      <div class="c-star" style="top:42%;right:8%;animation-delay:.9s;font-size:1.5rem">⭐</div>
      <div class="c-heart" style="top:10%;right:30%">🩷</div>
      <div class="c-heart" style="top:26%;left:30%;animation-delay:.6s">🩷</div>
      <div class="c-heart" style="top:38%;right:26%;animation-delay:1s;font-size:1rem">🩷</div>
      <div class="c-cloud" style="top:4%;right:8%">☁️</div>
      <div class="c-cloud" style="top:14%;left:4%;font-size:2rem;animation-delay:.8s">☁️</div>
      <div class="mountains">
        <div class="mt1"></div>
        <div class="mt2"></div>
      </div>
      <!-- 寝ているうさぎ（SVG） -->
      <div class="bunny-wrap">
        <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
          <!-- 雲 -->
          <ellipse cx="120" cy="122" rx="90" ry="20" fill="#c8e4f4"/>
          <circle cx="68" cy="110" r="24" fill="#d4eaf6"/>
          <circle cx="98" cy="101" r="29" fill="#d4eaf6"/>
          <circle cx="134" cy="104" r="26" fill="#d4eaf6"/>
          <circle cx="164" cy="111" r="21" fill="#d4eaf6"/>
          <ellipse cx="120" cy="124" rx="90" ry="16" fill="#daeefa"/>
          <!-- 体 -->
          <ellipse cx="108" cy="90" rx="52" ry="24" fill="#f8f2e0"/>
          <!-- しっぽ -->
          <circle cx="58" cy="86" r="14" fill="white"/>
          <!-- 頭 -->
          <circle cx="163" cy="76" r="28" fill="#f8f2e0"/>
          <!-- 左耳 -->
          <ellipse cx="148" cy="36" rx="9" ry="27" fill="#f8f2e0" transform="rotate(-7,148,36)"/>
          <ellipse cx="148" cy="36" rx="5" ry="20" fill="#f5b8b8" transform="rotate(-7,148,36)"/>
          <!-- 右耳 -->
          <ellipse cx="173" cy="33" rx="9" ry="27" fill="#f8f2e0" transform="rotate(7,173,33)"/>
          <ellipse cx="173" cy="33" rx="5" ry="20" fill="#f5b8b8" transform="rotate(7,173,33)"/>
          <!-- 目（閉じて笑顔） -->
          <path d="M150 74 Q155 69 160 74" stroke="#8b7355" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M165 74 Q170 69 175 74" stroke="#8b7355" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- 鼻 -->
          <ellipse cx="163" cy="82" rx="4" ry="3" fill="#e89090"/>
          <!-- ほっぺ -->
          <circle cx="150" cy="85" r="8" fill="#f5a0a0" opacity="0.4"/>
          <circle cx="176" cy="85" r="8" fill="#f5a0a0" opacity="0.4"/>
          <!-- 口 -->
          <path d="M160 85 Q163 89 166 85" stroke="#c08080" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- 前足 -->
          <ellipse cx="138" cy="107" rx="18" ry="9" fill="#f0e8d0"/>
        </svg>
      </div>
      <div class="card-trees">🌲🌲</div>
    </div>
    <div class="card-grass">
      <div class="card-text">きょうはおしまい。<br>またいっしょにあそぼうね！</div>
    </div>
  </div>
  <div class="oyasumi-title">おやすみ時間だよ</div>
  <div class="oyasumi-sub">朝7時から夜9時まで遊べるよ</div>
</div>

<!-- ========== ヘッダー ========== -->
<header>
  <div class="title">🐾 タップマルズ</div>
  <div class="header-row">
    <div class="score-item">
      <div class="score-label">🐾 スコア</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="timer-box">
      <div class="timer-label">⏱ のこり</div>
      <div class="timer-val" id="timer-val">3:00</div>
    </div>
  </div>
  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timer-bar" style="width:100%"></div>
  </div>
</header>

<div class="content">
  <button class="start-btn" id="start-btn" onclick="startGame()">🎮 はじめる！</button>
  <div class="game-area" id="game-area"></div>
  <div class="instructions">
    <p>🐾 どうぶつを タップすると てんすうが はいるよ！</p>
    <p>📱 スクロールして どうぶつを さがしてね</p>
    <p>🐾 タップしたら あたらしい どうぶつが でてくるよ</p>
    <p>⏱ 3ぷん で おしまいだよ</p>
  </div>
</div>

<!-- ========== 時間切れ画面 ========== -->
<div class="overlay" id="end-overlay">
  <div class="end-card">
    <div class="end-sky">
      <div class="c-star" style="top:10%;left:10%;font-size:1.4rem">⭐</div>
      <div class="c-star" style="top:8%;right:12%;font-size:1.2rem;animation-delay:.4s">⭐</div>
      <div class="c-star" style="top:28%;left:28%;font-size:1.5rem;animation-delay:.7s">⭐</div>
      <div class="c-star" style="top:20%;right:28%;font-size:1.2rem;animation-delay:.2s">⭐</div>
      <div class="c-star" style="top:38%;right:6%;font-size:1.3rem;animation-delay:.9s">⭐</div>
      <div class="c-heart" style="top:18%;left:38%">🩷</div>
      <div class="c-heart" style="top:34%;left:14%;animation-delay:.5s">🩷</div>
      <div class="c-cloud" style="top:5%;right:8%;font-size:2rem">☁️</div>
      <div class="c-cloud" style="top:22%;left:4%;font-size:1.7rem;animation-delay:.6s">☁️</div>
      <div class="mountains">
        <div class="mt1"></div>
        <div class="mt2"></div>
      </div>
      <!-- 終了画面もSVGうさぎ（小さめ） -->
      <div class="end-bunny-wrap">
        <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
          <ellipse cx="120" cy="122" rx="90" ry="20" fill="#c8e4f4"/>
          <circle cx="68" cy="110" r="24" fill="#d4eaf6"/>
          <circle cx="98" cy="101" r="29" fill="#d4eaf6"/>
          <circle cx="134" cy="104" r="26" fill="#d4eaf6"/>
          <circle cx="164" cy="111" r="21" fill="#d4eaf6"/>
          <ellipse cx="120" cy="124" rx="90" ry="16" fill="#daeefa"/>
          <ellipse cx="108" cy="90" rx="52" ry="24" fill="#f8f2e0"/>
          <circle cx="58" cy="86" r="14" fill="white"/>
          <circle cx="163" cy="76" r="28" fill="#f8f2e0"/>
          <ellipse cx="148" cy="36" rx="9" ry="27" fill="#f8f2e0" transform="rotate(-7,148,36)"/>
          <ellipse cx="148" cy="36" rx="5" ry="20" fill="#f5b8b8" transform="rotate(-7,148,36)"/>
          <ellipse cx="173" cy="33" rx="9" ry="27" fill="#f8f2e0" transform="rotate(7,173,33)"/>
          <ellipse cx="173" cy="33" rx="5" ry="20" fill="#f5b8b8" transform="rotate(7,173,33)"/>
          <path d="M150 74 Q155 69 160 74" stroke="#8b7355" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M165 74 Q170 69 175 74" stroke="#8b7355" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="163" cy="82" rx="4" ry="3" fill="#e89090"/>
          <circle cx="150" cy="85" r="8" fill="#f5a0a0" opacity="0.4"/>
          <circle cx="176" cy="85" r="8" fill="#f5a0a0" opacity="0.4"/>
          <path d="M160 85 Q163 89 166 85" stroke="#c08080" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="138" cy="107" rx="18" ry="9" fill="#f0e8d0"/>
        </svg>
      </div>
    </div>
    <div class="end-grass">
      <div class="end-grass-text">きょうはもうおしまいだよ<br>またあしたね</div>
    </div>
    <div class="end-bottom">
      <div class="end-title">おしまいだよ</div>
      <div class="end-sub">スコア：<span id="end-score">0</span> てん<br>またあした あそぼうね！</div>
      <button class="end-retry" onclick="resetGameEnd()">🔄 もういちど</button>
    </div>
  </div>
</div>

<script>
const ANIMALS = ['😺','🐶','🐰','🐵','🐸','🐼','🐧'];
const TOTAL = 12;
const GAME_TIME = 180;
const PLAY_START = 7;
const PLAY_END = 21;

let score = 0, timerInterval = null, secondsLeft = GAME_TIME, gameRunning = false;

function checkTime() {
  const h = new Date().getHours();
  if (h < PLAY_START || h >= PLAY_END) {
    document.getElementById('oyasumi-screen').classList.add('show');
  } else {
    document.getElementById('oyasumi-screen').classList.remove('show');
  }
}

function startGame() {
  score = 0; secondsLeft = GAME_TIME; gameRunning = true;
  document.getElementById('score').textContent = '0';
  document.getElementById('start-btn').textContent = '🔄 もういちど';
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  placeAnimals();
}

function resetGameEnd() {
  document.getElementById('end-overlay').classList.remove('show');
  startGame();
}

function tickTimer() {
  secondsLeft--;
  updateTimerDisplay();
  if (secondsLeft <= 0) gameOver();
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
  const val = document.getElementById('timer-val');
  val.textContent = `${m}:${String(s).padStart(2,'0')}`;
  val.className = 'timer-val' + (secondsLeft <= 30 ? ' warn' : '');
  document.getElementById('timer-bar').style.width = (secondsLeft / GAME_TIME * 100) + '%';
}

function gameOver() {
  clearInterval(timerInterval); gameRunning = false;
  document.getElementById('end-score').textContent = score;
  document.getElementById('end-overlay').classList.add('show');
}

function placeAnimals() {
  const area = document.getElementById('game-area');
  area.innerHTML = '';
  const areaW = area.clientWidth || 440, areaH = 1500, size = 128, margin = 16;
  const placed = [];
  const list = [];
  for (let i = 0; i < TOTAL; i++) list.push(ANIMALS[i % ANIMALS.length]);
  list.sort(() => Math.random() - .5);
  for (const emoji of list) {
    let x, y, ok = false, attempts = 0;
    while (!ok && attempts < 300) {
      x = margin + Math.random() * (areaW - size - margin * 2);
      y = margin + Math.random() * (areaH - size - margin * 2);
      ok = placed.every(p => Math.abs(p.x - x) > size + 8 || Math.abs(p.y - y) > size + 8);
      attempts++;
    }
    placed.push({x, y});
    const el = document.createElement('div');
    el.className = 'animal';
    el.textContent = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    const tap = () => tapAnimal(el);
    el.addEventListener('click', tap);
    el.addEventListener('touchend', e => { e.preventDefault(); tap(); });
    area.appendChild(el);
  }
}

function tapAnimal(el) {
  if (!gameRunning || el.classList.contains('popping')) return;
  el.classList.add('popping');
  score += 10;
  document.getElementById('score').textContent = score;
  setTimeout(() => { el.remove(); spawnAnimal(); }, 420);
}

function spawnAnimal() {
  if (!gameRunning) return;
  const area = document.getElementById('game-area');
  const areaW = area.clientWidth || 440, areaH = 1500, size = 128, margin = 16;
  const existing = Array.from(area.querySelectorAll('.animal')).map(e => ({x: parseFloat(e.style.left), y: parseFloat(e.style.top)}));
  let x, y, ok = false, attempts = 0;
  while (!ok && attempts < 300) {
    x = margin + Math.random() * (areaW - size - margin * 2);
    y = margin + Math.random() * (areaH - size - margin * 2);
    ok = existing.every(p => Math.abs(p.x - x) > size + 8 || Math.abs(p.y - y) > size + 8);
    attempts++;
  }
  const emoji = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  const el = document.createElement('div');
  el.className = 'animal';
  el.textContent = emoji;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  const tap = () => tapAnimal(el);
  el.addEventListener('click', tap);
  el.addEventListener('touchend', e => { e.preventDefault(); tap(); });
  area.appendChild(el);
}

checkTime();
setInterval(checkTime, 60000);
</script>
</body>
</html>
