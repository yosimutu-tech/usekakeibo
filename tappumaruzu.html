<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>タップマルズ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タップマルズ">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
  background:linear-gradient(160deg,#ffe8f5,#e8f0ff,#e8fff0);
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}

/* ===== おやすみ画面 ===== */
.oyasumi-screen{
  display:none;
  position:fixed;
  inset:0;
  background:linear-gradient(160deg,#0a0020,#1a0050,#000820);
  z-index:999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px;
}
.oyasumi-screen.show{display:flex}
.oyasumi-moon{font-size:6rem;animation:moon-glow 3s ease-in-out infinite alternate}
@keyframes moon-glow{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.08) rotate(5deg)}}
.oyasumi-title{font-size:2rem;font-weight:900;color:#ffe8a0;margin:20px 0 10px;text-shadow:0 0 20px rgba(255,232,160,.5)}
.oyasumi-sub{font-size:1.05rem;color:#b0a0e0;line-height:1.7}
.stars-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star-dot{position:absolute;background:white;border-radius:50%;animation:twinkle 2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}

/* ===== ヘッダー ===== */
header{
  text-align:center;
  padding:14px 16px 8px;
  background:white;
  border-bottom:5px solid #ffb3d9;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 3px 12px rgba(255,100,180,.15);
}
.title{
  font-size:2rem;
  font-weight:900;
  background:linear-gradient(135deg,#ff6ec7,#a855f7,#3b82f6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:.06em;
}
.header-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:8px 0 4px;
  flex-wrap:wrap;
}
.score-item{
  background:#f5f8ff;
  border-radius:14px;
  padding:5px 14px;
  text-align:center;
  border:3px solid #c7d8ff;
  min-width:90px;
}
.score-label{font-size:.68rem;color:#999;font-weight:700}
.score-val{font-size:1.7rem;font-weight:900;color:#3b82f6;line-height:1.1}
.score-val.green{color:#22c55e}

/* タイマー */
.timer-box{
  background:#fff8e8;
  border-radius:14px;
  padding:5px 14px;
  text-align:center;
  border:3px solid #ffd080;
  min-width:90px;
}
.timer-label{font-size:.68rem;color:#999;font-weight:700}
.timer-val{font-size:1.7rem;font-weight:900;color:#f59e0b;line-height:1.1}
.timer-val.warn{color:#ef4444;animation:blink .5s step-start infinite}
@keyframes blink{50%{opacity:.3}}

/* タイマーバー */
.timer-bar-wrap{
  height:8px;
  background:#f0f0f0;
  border-radius:4px;
  margin:4px 2px 0;
  overflow:hidden;
}
.timer-bar{
  height:100%;
  background:linear-gradient(90deg,#4ade80,#fbbf24,#ef4444);
  border-radius:4px;
  transition:width 1s linear;
}

/* コンテンツ */
.content{padding:12px 14px 30px}

.start-btn{
  display:block;
  width:100%;
  padding:17px;
  background:linear-gradient(135deg,#4ade80,#22c55e);
  border:none;
  border-radius:22px;
  color:white;
  font-size:1.5rem;
  font-weight:900;
  cursor:pointer;
  margin-bottom:14px;
  box-shadow:0 6px 0 #16a34a,0 8px 20px rgba(34,197,94,.35);
  transition:transform .1s,box-shadow .1s;
  font-family:inherit;
  letter-spacing:.07em;
}
.start-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #16a34a}

/* ゲームエリア */
.game-area{
  background:linear-gradient(180deg,#e4f3fc,#d8ecf8);
  border-radius:26px;
  border:5px solid #90caf9;
  position:relative;
  width:100%;
  height:1500px;
  overflow:hidden;
  box-shadow:inset 0 3px 12px rgba(144,202,249,.3);
}

/* 動物 */
.animal{
  position:absolute;
  font-size:88px;
  line-height:1;
  cursor:pointer;
  touch-action:manipulation;
  display:flex;
  align-items:center;
  justify-content:center;
  width:128px;
  height:128px;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:transform .12s;
}
.animal:active{transform:scale(1.25)}
@keyframes pop-out{
  0%{transform:scale(1);opacity:1}
  35%{transform:scale(1.6);opacity:1}
  100%{transform:scale(0.1);opacity:0}
}
.animal.popping{
  animation:pop-out .42s cubic-bezier(.36,.07,.19,.97) forwards;
  pointer-events:none;
}

/* 遊び方 */
.instructions{
  background:white;
  border-radius:18px;
  padding:13px 16px;
  margin-top:13px;
  border:3px solid #f0e8ff;
}
.instructions p{
  font-size:.88rem;
  color:#666;
  margin-bottom:6px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  line-height:1.5;
}
.instructions p:last-child{margin-bottom:0}

/* ===== クリア画面 ===== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  align-items:center;
  justify-content:center;
}
.overlay.show{display:flex}

.result-box{
  background:white;
  border-radius:32px;
  padding:38px 26px;
  text-align:center;
  max-width:300px;
  width:88%;
  position:relative;
  z-index:201;
}
.result-box.clear{border:6px solid #ffd700;box-shadow:0 0 50px rgba(255,215,0,.6)}
.result-box.end{border:6px solid #a78bfa;box-shadow:0 0 40px rgba(167,139,250,.4)}

.result-emoji{font-size:4.5rem;display:block;margin-bottom:12px}
.result-emoji.bounce{animation:bounce-em .6s ease infinite alternate}
@keyframes bounce-em{from{transform:scale(1)}to{transform:scale(1.12)}}

.result-title{font-size:2rem;font-weight:900;margin-bottom:6px}
.result-title.pink{color:#ff6ec7}
.result-title.purple{color:#7c3aed}
.result-sub{font-size:1rem;color:#888;margin-bottom:24px;line-height:1.6}
.result-score-big{font-size:2.4rem;font-weight:900;color:#3b82f6;margin:8px 0}

.action-btn{
  display:block;
  width:100%;
  border:none;
  border-radius:18px;
  padding:14px;
  font-size:1.2rem;
  font-weight:900;
  cursor:pointer;
  font-family:inherit;
  margin-bottom:10px;
}
.btn-retry{
  background:linear-gradient(135deg,#f97316,#ef4444);
  color:white;
  box-shadow:0 4px 0 #b91c1c;
}
.btn-retry:active{transform:translateY(3px);box-shadow:0 1px 0 #b91c1c}
.btn-end{background:#f3f4f6;color:#888;box-shadow:0 3px 0 #d1d5db;font-size:1rem}

/* 紙吹雪 */
.confetti-piece{
  position:fixed;
  width:11px;height:11px;
  border-radius:2px;
  z-index:300;
  pointer-events:none;
}
@keyframes confetti-fall{
  0%{transform:translateY(-30px) rotate(0deg) scale(1);opacity:1}
  100%{transform:translateY(105vh) rotate(780deg) scale(.5);opacity:0}
}
</style>
</head>
<body>

<!-- おやすみ画面 -->
<div class="oyasumi-screen" id="oyasumi-screen">
  <div class="stars-bg" id="stars-bg"></div>
  <div class="oyasumi-moon">🌙</div>
  <div class="oyasumi-title">もう おやすみの<br>じかんだよ</div>
  <div class="oyasumi-sub" style="margin-top:16px">
    あそべる じかんは<br>
    <strong style="color:#ffe8a0">あさ 7じ 〜 よる 9じ</strong><br><br>
    また あした あそぼうね！⭐
  </div>
</div>

<header>
  <div class="title">🐾 タップマルズ</div>
  <div class="header-row">
    <div class="score-item">
      <div class="score-label">🐾 みつけた</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">ぜんぶで</div>
      <div class="score-val green">10</div>
    </div>
    <div class="timer-box">
      <div class="timer-label">⏱ のこり</div>
      <div class="timer-val" id="timer-val">3:00</div>
    </div>
  </div>
  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timer-bar" style="width:100%"></div>
  </div>
</header>

<div class="content">
  <button class="start-btn" id="start-btn" onclick="startGame()">🎮 はじめる！</button>
  <div class="game-area" id="game-area"></div>
  <div class="instructions">
    <p>🐾 どうぶつを タップすると てんすうが はいるよ！</p>
    <p>📱 スクロールして ぜんぶ みつけてね</p>
    <p>⏱ 3ぷん で おしまいだよ</p>
  </div>
</div>

<!-- クリア画面 -->
<div class="overlay" id="clear-overlay">
  <div class="result-box clear">
    <span class="result-emoji bounce">🎉</span>
    <div class="result-title pink">やったー！</div>
    <div class="result-sub">ぜんぶ みつけたよ！<br>すごい すごい！</div>
    <button class="action-btn btn-retry" onclick="resetGame()">🔄 もういちど</button>
  </div>
</div>

<!-- 時間切れ画面 -->
<div class="overlay" id="end-overlay">
  <div class="result-box end">
    <span class="result-emoji">😊</span>
    <div class="result-title purple">じかん きれだよ！</div>
    <div class="result-sub">
      <span id="end-score-text">みつけた：0 こ</span><br>
      またあした あそぼうね！
    </div>
    <button class="action-btn btn-retry" onclick="resetGame()">🔄 もういちど</button>
  </div>
</div>

<script>
const ANIMALS = ['🐰','🐱','🐒','🐸','🐧'];
const TOTAL = 10;
const GAME_TIME = 180; // 3分
const PLAY_START = 7;  // 7時
const PLAY_END = 21;   // 21時

let score = 0;
let timerInterval = null;
let secondsLeft = GAME_TIME;
let gameRunning = false;

// ===== 時間制限チェック =====
function checkTime() {
  const h = new Date().getHours();
  if (h < PLAY_START || h >= PLAY_END) {
    showOyasumi();
  }
}

function showOyasumi() {
  // 星を生成
  const bg = document.getElementById('stars-bg');
  bg.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star-dot';
    const sz = 1 + Math.random() * 3;
    s.style.cssText = `
      width:${sz}px;height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*2}s;
    `;
    bg.appendChild(s);
  }
  document.getElementById('oyasumi-screen').classList.add('show');
}

// ===== ゲーム =====
function startGame() {
  score = 0;
  secondsLeft = GAME_TIME;
  gameRunning = true;
  document.getElementById('score').textContent = '0';
  document.getElementById('start-btn').textContent = '🔄 もういちど';
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  placeAnimals();
}

function resetGame() {
  document.getElementById('clear-overlay').classList.remove('show');
  document.getElementById('end-overlay').classList.remove('show');
  startGame();
}

// ===== タイマー =====
function tickTimer() {
  secondsLeft--;
  updateTimerDisplay();
  if (secondsLeft <= 0) {
    gameOver();
  }
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60);
  const s = secondsLeft % 60;
  const val = document.getElementById('timer-val');
  val.textContent = `${m}:${String(s).padStart(2,'0')}`;
  val.className = 'timer-val' + (secondsLeft <= 30 ? ' warn' : '');
  const pct = (secondsLeft / GAME_TIME) * 100;
  document.getElementById('timer-bar').style.width = pct + '%';
}

function gameOver() {
  clearInterval(timerInterval);
  gameRunning = false;
  document.getElementById('end-score-text').textContent = `みつけた：${score} こ`;
  document.getElementById('end-overlay').classList.add('show');
}

// ===== 動物配置 =====
function placeAnimals() {
  const area = document.getElementById('game-area');
  area.innerHTML = '';

  const areaW = area.clientWidth || 440;
  const areaH = 1500;
  const size = 128;
  const margin = 16;
  const placed = [];

  const list = [];
  for (let i = 0; i < TOTAL; i++) list.push(ANIMALS[i % ANIMALS.length]);
  list.sort(() => Math.random() - .5);

  for (const emoji of list) {
    let x, y, ok = false, attempts = 0;
    while (!ok && attempts < 300) {
      x = margin + Math.random() * (areaW - size - margin * 2);
      y = margin + Math.random() * (areaH - size - margin * 2);
      ok = placed.every(p => Math.abs(p.x - x) > size + 8 || Math.abs(p.y - y) > size + 8);
      attempts++;
    }
    placed.push({x, y});

    const el = document.createElement('div');
    el.className = 'animal';
    el.textContent = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const tap = () => tapAnimal(el);
    el.addEventListener('click', tap);
    el.addEventListener('touchend', e => { e.preventDefault(); tap(); });
    area.appendChild(el);
  }
}

function tapAnimal(el) {
  if (!gameRunning || el.classList.contains('popping')) return;
  el.classList.add('popping');
  score++;
  document.getElementById('score').textContent = score;
  setTimeout(() => {
    el.remove();
    if (score >= TOTAL) showClear();
  }, 420);
}

function showClear() {
  clearInterval(timerInterval);
  gameRunning = false;
  document.getElementById('clear-overlay').classList.add('show');
  launchConfetti();
}

const COLORS = ['#ff6ec7','#ffd700','#4ade80','#60a5fa','#f97316','#a855f7','#f43f5e','#06b6d4'];

function launchConfetti() {
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        background:${COLORS[Math.floor(Math.random()*COLORS.length)]};
        left:${Math.random()*100}vw;top:-30px;
        border-radius:${Math.random()>.5?'50%':'2px'};
        animation:confetti-fall ${1.4+Math.random()*1.8}s ease-in forwards;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }, i * 28);
  }
}

// 起動時に時間チェック
checkTime();
// 1分ごとに再チェック（日をまたいだ場合など）
setInterval(checkTime, 60000);
</script>
</body>
</html>
