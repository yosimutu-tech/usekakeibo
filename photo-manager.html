<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真重複削除ツール</title>
<style>
  :root {
    --navy:  #16365C;
    --gold:  #F4A300;
    --bg:    #FBF8F1;
    --white: #FFFFFF;
    --text:  #2D2D2D;
    --muted: #5A6370;
    --red:   #C0392B;
    --green: #27AE60;
    --shadow: 0 4px 16px rgba(22,54,92,.10);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
  }

  header {
    background: var(--navy);
    padding: 36px 32px 28px;
    text-align: center;
  }
  header h1 { color: #fff; font-size: clamp(20px,4vw,30px); font-weight: 700; margin-bottom: 8px; }
  header p  { color: rgba(255,255,255,.70); font-size: 14px; }

  main { max-width: 900px; margin: 0 auto; padding: 40px 20px 64px; display: flex; flex-direction: column; gap: 28px; }

  .card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 32px; }

  /* drop zone */
  #dropzone {
    border: 2.5px dashed #C8BFA8;
    border-radius: 14px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: var(--bg);
  }
  #dropzone.over { border-color: var(--gold); background: #FFF8E8; }
  #dropzone .icon { font-size: 48px; margin-bottom: 12px; }
  #dropzone p { color: var(--muted); font-size: 14px; }
  #dropzone strong { color: var(--navy); font-size: 16px; display: block; margin-bottom: 6px; }
  #fileInput { display: none; }

  /* buttons */
  .btn {
    display: inline-block; padding: 12px 32px; border-radius: 50px;
    font-size: 15px; font-weight: 700; cursor: pointer; border: none;
    letter-spacing: .04em; transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--gold); color: var(--navy); box-shadow: 0 4px 14px rgba(244,163,0,.40); }
  .btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* progress */
  #progressWrap { display: none; }
  #progressBar { height: 8px; background: #EDE9E0; border-radius: 4px; overflow: hidden; margin: 14px 0 6px; }
  #progressFill { height: 100%; background: var(--gold); border-radius: 4px; transition: width .1s; width: 0%; }
  #progressLabel { font-size: 13px; color: var(--muted); }

  /* summary */
  #summary { display: none; }
  .stat-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-box {
    flex: 1; min-width: 120px; background: var(--bg); border-radius: 10px;
    padding: 16px 20px; text-align: center;
  }
  .stat-box .num { font-size: 28px; font-weight: 700; color: var(--navy); }
  .stat-box .lbl { font-size: 12px; color: var(--muted); }
  .stat-box.warn .num { color: var(--red); }
  .stat-box.good .num { color: var(--green); }

  /* duplicate groups */
  #results { display: none; }
  .group-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .group-title { font-size: 16px; font-weight: 700; color: var(--navy); }
  .tag {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    letter-spacing: .08em;
  }
  .tag-keep   { background: #E8F8EF; color: var(--green); }
  .tag-delete { background: #FDEDED; color: var(--red); }

  .photo-list { display: flex; flex-direction: column; gap: 10px; }
  .photo-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 10px;
    border: 1.5px solid transparent;
  }
  .photo-item.keep   { background: #F0FBF4; border-color: #A9DFBF; }
  .photo-item.delete { background: #FEF5F5; border-color: #F5ABAB; }
  .photo-item img {
    width: 64px; height: 64px; object-fit: cover;
    border-radius: 8px; flex-shrink: 0;
  }
  .photo-info { flex: 1; min-width: 0; }
  .photo-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photo-meta { font-size: 12px; color: var(--muted); }
  .photo-status { flex-shrink: 0; }

  .divider-group { height: 1px; background: #EDE9E0; margin: 4px 0 24px; }

  /* no duplicates */
  .no-dup { text-align: center; padding: 32px 0; color: var(--muted); font-size: 15px; }
  .no-dup .icon { font-size: 40px; margin-bottom: 10px; }

  /* download section */
  #downloadSection { display: none; }
  .dl-note { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  .dl-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .dl-list li { display: flex; align-items: center; gap: 10px; }
  .dl-list a {
    color: var(--navy); font-size: 13px; font-weight: 600;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
  }
  .dl-list a:hover { text-decoration: underline; }
  .dl-list .fname { color: var(--muted); font-size: 12px; }

  footer {
    background: var(--navy); color: rgba(255,255,255,.45);
    text-align: center; padding: 22px 16px; font-size: 12.5px; letter-spacing: .04em;
  }
  footer span { color: var(--gold); }

  @media (max-width: 600px) {
    .card { padding: 20px 16px; }
    .photo-item img { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

<header>
  <h1>写真重複削除ツール</h1>
  <p>同じ写真が複数ある場合、最新の1枚だけを残して他を削除対象にします</p>
</header>

<main>

  <!-- STEP 1: Upload -->
  <div class="card">
    <div id="dropzone">
      <div class="icon">🖼️</div>
      <strong>写真をここにドラッグ＆ドロップ</strong>
      <p>またはクリックしてファイルを選択（複数可）</p>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*">
    <div style="margin-top: 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <button class="btn btn-primary" id="analyzeBtn" disabled>重複を検索する</button>
      <button class="btn btn-outline" id="resetBtn">リセット</button>
      <span id="fileCount" style="color:var(--muted);font-size:13px;"></span>
    </div>
  </div>

  <!-- STEP 2: Progress -->
  <div class="card" id="progressWrap">
    <div style="font-weight:700; color:var(--navy); margin-bottom:4px;">解析中...</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressLabel">ファイルを読み込んでいます</div>
  </div>

  <!-- STEP 3: Summary -->
  <div class="card" id="summary">
    <div class="group-header" style="margin-bottom:20px;">
      <span class="group-title">解析結果</span>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">合計ファイル数</div></div>
      <div class="stat-box warn"><div class="num" id="statDelete">0</div><div class="lbl">削除対象（重複）</div></div>
      <div class="stat-box good"><div class="num" id="statKeep">0</div><div class="lbl">保持（最新）</div></div>
    </div>
  </div>

  <!-- STEP 4: Duplicate list -->
  <div class="card" id="results">
    <div class="group-title" style="margin-bottom:20px;">重複グループ一覧</div>
    <div id="groupContainer"></div>
  </div>

  <!-- STEP 5: Download kept files -->
  <div class="card" id="downloadSection">
    <div class="group-title" style="margin-bottom:10px;">保持するファイルをダウンロード</div>
    <p class="dl-note">
      ブラウザからは直接ファイルを削除できないため、<strong>残すべき写真</strong>をダウンロードできます。<br>
      ダウンロード後、元のフォルダを整理してご利用ください。
    </p>
    <ul class="dl-list" id="keepFileList"></ul>
  </div>

</main>

<footer>
  写真重複削除ツール ✦ <span>Produced with Claude Code</span>
</footer>

<script>
(() => {
  const dropzone    = document.getElementById('dropzone');
  const fileInput   = document.getElementById('fileInput');
  const analyzeBtn  = document.getElementById('analyzeBtn');
  const resetBtn    = document.getElementById('resetBtn');
  const fileCount   = document.getElementById('fileCount');
  const progressWrap  = document.getElementById('progressWrap');
  const progressFill  = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const summaryEl   = document.getElementById('summary');
  const resultsEl   = document.getElementById('results');
  const downloadSection = document.getElementById('downloadSection');

  let selectedFiles = [];

  // --- Drag & Drop ---
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('over');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => addFiles([...fileInput.files]));

  function addFiles(files) {
    const images = files.filter(f => f.type.startsWith('image/'));
    selectedFiles = [...selectedFiles, ...images];
    fileCount.textContent = `${selectedFiles.length} 枚選択中`;
    analyzeBtn.disabled = selectedFiles.length === 0;
  }

  resetBtn.addEventListener('click', () => {
    selectedFiles = [];
    fileInput.value = '';
    fileCount.textContent = '';
    analyzeBtn.disabled = true;
    progressWrap.style.display = 'none';
    summaryEl.style.display = 'none';
    resultsEl.style.display = 'none';
    downloadSection.style.display = 'none';
    document.getElementById('groupContainer').innerHTML = '';
    document.getElementById('keepFileList').innerHTML = '';
  });

  // --- Hash computation ---
  async function hashFile(file) {
    const buf = await file.arrayBuffer();
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function formatDate(ms) {
    const d = new Date(ms);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ` +
           `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // --- Analyze ---
  analyzeBtn.addEventListener('click', async () => {
    analyzeBtn.disabled = true;
    progressWrap.style.display = 'block';
    summaryEl.style.display = 'none';
    resultsEl.style.display = 'none';
    downloadSection.style.display = 'none';

    const total = selectedFiles.length;
    const hashMap = {};

    for (let i = 0; i < total; i++) {
      const file = selectedFiles[i];
      progressFill.style.width = ((i + 1) / total * 100) + '%';
      progressLabel.textContent = `(${i + 1} / ${total}) ${file.name} を解析中...`;

      const hash = await hashFile(file);
      if (!hashMap[hash]) hashMap[hash] = [];
      hashMap[hash].push(file);
    }

    progressWrap.style.display = 'none';

    // find duplicates
    const dupGroups = Object.values(hashMap).filter(g => g.length > 1);

    // sort each group: newest first (largest lastModified = latest)
    dupGroups.forEach(g => g.sort((a, b) => b.lastModified - a.lastModified));

    const deleteCount = dupGroups.reduce((s, g) => s + g.length - 1, 0);
    const keepCount   = total - deleteCount;

    // Summary
    document.getElementById('statTotal').textContent  = total;
    document.getElementById('statDelete').textContent = deleteCount;
    document.getElementById('statKeep').textContent   = keepCount;
    summaryEl.style.display = 'block';

    // Build result UI
    const container = document.getElementById('groupContainer');
    container.innerHTML = '';

    if (dupGroups.length === 0) {
      container.innerHTML = `<div class="no-dup"><div class="icon">✅</div>重複している写真は見つかりませんでした</div>`;
    } else {
      dupGroups.forEach((group, gi) => {
        const titleEl = document.createElement('div');
        titleEl.className = 'group-header';
        titleEl.innerHTML = `<span class="group-title">グループ ${gi + 1}（${group.length} 枚）</span>`;
        container.appendChild(titleEl);

        const list = document.createElement('div');
        list.className = 'photo-list';

        group.forEach((file, idx) => {
          const isKeep = idx === 0;
          const url = URL.createObjectURL(file);

          const item = document.createElement('div');
          item.className = 'photo-item ' + (isKeep ? 'keep' : 'delete');

          const img = document.createElement('img');
          img.src = url;
          img.alt = file.name;

          const info = document.createElement('div');
          info.className = 'photo-info';
          info.innerHTML = `
            <div class="photo-name">${file.name}</div>
            <div class="photo-meta">
              更新日時：${formatDate(file.lastModified)}　／　サイズ：${formatBytes(file.size)}
            </div>
          `;

          const statusEl = document.createElement('div');
          statusEl.className = 'photo-status';
          statusEl.innerHTML = isKeep
            ? `<span class="tag tag-keep">✓ 保持</span>`
            : `<span class="tag tag-delete">✕ 削除対象</span>`;

          item.appendChild(img);
          item.appendChild(info);
          item.appendChild(statusEl);
          list.appendChild(item);
        });

        container.appendChild(list);

        if (gi < dupGroups.length - 1) {
          const div = document.createElement('div');
          div.className = 'divider-group';
          container.appendChild(div);
        }
      });
    }

    resultsEl.style.display = 'block';

    // Build download list (keep files: non-duplicates + newest of each group)
    const keepFiles = [];
    // singletons
    Object.values(hashMap).filter(g => g.length === 1).forEach(g => keepFiles.push(g[0]));
    // newest of each dup group
    dupGroups.forEach(g => keepFiles.push(g[0]));

    if (keepFiles.length > 0) {
      const keepList = document.getElementById('keepFileList');
      keepList.innerHTML = '';
      keepFiles.forEach(file => {
        const url = URL.createObjectURL(file);
        const li = document.createElement('li');
        li.innerHTML = `
          <a href="${url}" download="${file.name}">
            ⬇️ ${file.name}
          </a>
          <span class="fname">${formatDate(file.lastModified)} ／ ${formatBytes(file.size)}</span>
        `;
        keepList.appendChild(li);
      });
      downloadSection.style.display = 'block';
    }

    analyzeBtn.disabled = false;
  });
})();
</script>
</body>
</html>
