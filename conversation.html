<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会話アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      font-size: 22px;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2c5f8a;
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 26px;
      font-weight: bold;
      flex-shrink: 0;
    }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 20px;
      font-size: 22px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.voice {
      background: #d1eaff;
      border: 2px solid #2c5f8a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.text {
      background: #d4f4d4;
      border: 2px solid #2a7a2a;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message .sender {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      opacity: 0.75;
    }

    .message.voice .sender { color: #1a4a6e; }
    .message.text .sender  { color: #1a5a1a; }

    /* 音声入力中プレビュー */
    #interim-bubble {
      display: none;
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 20px;
      font-size: 22px;
      line-height: 1.6;
      background: #eaf4ff;
      border: 2px dashed #2c5f8a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      color: #555;
    }

    /* 入力エリア */
    #input-area {
      flex-shrink: 0;
      background: #fff;
      border-top: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ---- 音声入力パネル ---- */
    #voice-panel {
      background: #e8f4fd;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #c0d8ef;
    }

    #voice-panel .panel-label {
      font-size: 18px;
      color: #2c5f8a;
      font-weight: bold;
    }

    #mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: #2c5f8a;
      color: white;
      font-size: 44px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(44,95,138,0.4);
    }

    #mic-btn:active { transform: scale(0.93); }
    #mic-btn.listening {
      background: #c0392b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
      50%       { box-shadow: 0 0 0 14px rgba(192,57,43,0); }
    }

    #mic-status {
      font-size: 18px;
      color: #555;
      min-height: 1.4em;
    }

    /* ---- テキスト入力パネル ---- */
    #text-panel {
      background: #eefaee;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #text-panel .panel-label {
      font-size: 18px;
      color: #2a7a2a;
      font-weight: bold;
    }

    #text-panel .row {
      display: flex;
      gap: 10px;
    }

    #text-input {
      flex: 1;
      font-size: 22px;
      padding: 12px 16px;
      border: 2px solid #2a7a2a;
      border-radius: 12px;
      outline: none;
    }

    #text-input:focus { border-color: #1a5a1a; box-shadow: 0 0 0 3px rgba(42,122,42,0.25); }

    #send-btn {
      font-size: 22px;
      padding: 12px 24px;
      background: #2a7a2a;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    #send-btn:active { opacity: 0.8; }

    /* クリアボタン */
    #clear-btn {
      align-self: flex-end;
      font-size: 16px;
      padding: 6px 16px;
      background: #888;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 非対応メッセージ */
    #no-support {
      display: none;
      color: #c0392b;
      font-size: 18px;
      text-align: center;
      padding: 8px;
      background: #fdd;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<header>会話アプリ</header>

<div id="chat-area">
  <div id="interim-bubble">（認識中…）</div>
</div>

<div id="input-area">

  <!-- 音声入力（身体障害者側） -->
  <div id="voice-panel">
    <div class="panel-label">🎤 あなた（音声で話す）</div>
    <button id="mic-btn" title="マイクを押して話す">🎤</button>
    <div id="mic-status">ボタンを押して話してください</div>
    <div id="no-support">お使いのブラウザは音声認識に対応していません。<br>Chrome/Edgeをお試しください。</div>
  </div>

  <!-- テキスト入力（聴覚障害者側） -->
  <div id="text-panel">
    <div class="panel-label">⌨️ 相手（聴覚障害者）がテキストで返信</div>
    <div class="row">
      <input id="text-input" type="text" placeholder="ここに文字を入力…" />
      <button id="send-btn">送信</button>
    </div>
  </div>

</div>

<script>
  const chatArea    = document.getElementById('chat-area');
  const interimBubble = document.getElementById('interim-bubble');
  const micBtn      = document.getElementById('mic-btn');
  const micStatus   = document.getElementById('mic-status');
  const noSupport   = document.getElementById('no-support');
  const textInput   = document.getElementById('text-input');
  const sendBtn     = document.getElementById('send-btn');

  // ---- メッセージ追加 ----
  function addMessage(text, type) {
    // interim バブルより前に挿入するため先に消す
    interimBubble.style.display = 'none';
    interimBubble.textContent   = '（認識中…）';

    const div = document.createElement('div');
    div.className = 'message ' + type;

    const sender = document.createElement('div');
    sender.className = 'sender';
    sender.textContent = type === 'voice' ? '🎤 あなた' : '⌨️ 相手';
    div.appendChild(sender);

    const body = document.createElement('div');
    body.textContent = text;
    div.appendChild(body);

    // interim より前に追加
    chatArea.insertBefore(div, interimBubble);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ---- 音声認識 ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    noSupport.style.display = 'block';
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = false;

    let listening = false;

    micBtn.addEventListener('click', () => {
      if (listening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      micBtn.textContent = '⏹';
      micStatus.textContent = '聞いています…';
      interimBubble.style.display = 'block';
      chatArea.scrollTop = chatArea.scrollHeight;
    };

    recognition.onresult = (e) => {
      let interim = '';
      let final   = '';
      for (const res of e.results) {
        if (res.isFinal) final   += res[0].transcript;
        else             interim += res[0].transcript;
      }
      if (final) {
        addMessage(final, 'voice');
      } else {
        interimBubble.textContent = interim || '（認識中…）';
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    };

    recognition.onerror = (e) => {
      micStatus.textContent = 'エラー: ' + (e.error === 'no-speech' ? '音声が聞こえませんでした' : e.error);
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
      micStatus.textContent = 'ボタンを押して話してください';
      interimBubble.style.display = 'none';
      interimBubble.textContent   = '（認識中…）';
    };
  }

  // ---- テキスト送信 ----
  function sendText() {
    const txt = textInput.value.trim();
    if (!txt) return;
    addMessage(txt, 'text');
    textInput.value = '';
    textInput.focus();
  }

  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendText();
  });
</script>
</body>
</html>
