<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>タップマルズ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タップマルズ">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Hiragino Maru Gothic Pro','Hiragino Sans','Yu Gothic',sans-serif;
  background:#f8f8f8;
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}

/* ========== おやすみ画面 ========== */
.oyasumi-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:white;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 24px 30px;
  overflow:hidden;
}
.oyasumi-screen.show{display:flex}

/* おやすみカード */
.oyasumi-card{
  width:100%;
  max-width:340px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.18);
  margin-bottom:28px;
}

/* カード内：夜空 */
.card-sky{
  background:linear-gradient(180deg,#1a3a6a 0%,#1e4880 50%,#1a3a6a 100%);
  padding:20px 20px 0;
  position:relative;
  min-height:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}

/* 星（黄色） */
.c-star{
  position:absolute;
  font-size:1.7rem;
  animation:star-twinkle 2s ease-in-out infinite alternate;
}
/* ハート（ピンク） */
.c-heart{
  position:absolute;
  font-size:1.1rem;
  animation:heart-beat 2s ease-in-out infinite alternate;
}
/* 雲（ミント色っぽく） */
.c-cloud{
  position:absolute;
  font-size:2.2rem;
  animation:cloud-drift 5s ease-in-out infinite alternate;
  filter:hue-rotate(130deg) saturate(0.7) brightness(1.4);
}
@keyframes star-twinkle{from{transform:scale(1);opacity:.75}to{transform:scale(1.2);opacity:1}}
@keyframes heart-beat{from{transform:scale(1)}to{transform:scale(1.15)}}
@keyframes cloud-drift{from{transform:translateX(0)}to{transform:translateX(6px)}}

/* 眠るうさぎエリア */
.bunny-wrap{
  position:relative;
  z-index:2;
  width:220px;
  height:130px;
  margin:0 auto -10px;
  animation:float-cloud 3s ease-in-out infinite alternate;
}
@keyframes float-cloud{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.bunny-cloud{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  font-size:9rem;
  line-height:1;
  filter:brightness(1.9) saturate(0.15);
}
.bunny-emoji{
  position:absolute;
  bottom:38px;left:50%;
  transform:translateX(-50%);
  font-size:4.2rem;
  line-height:1;
}

/* 山のシルエット */
.mountains{
  position:absolute;
  bottom:0;left:0;right:0;
  height:80px;
  overflow:hidden;
}
.mt1{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-bottom:100px solid #1a4a25;
}
.mt2{
  position:absolute;
  bottom:0;right:10%;
  width:0;height:0;
  border-left:70px solid transparent;
  border-right:70px solid transparent;
  border-bottom:80px solid #163d1f;
}

/* カード内：草エリア */
.card-grass{
  background:linear-gradient(180deg,#1d5a28,#1a5025);
  padding:14px 16px 18px;
  text-align:center;
  position:relative;
}
/* 木 */
.card-trees{
  position:absolute;
  bottom:100%;left:12%;
  display:flex;gap:6px;
  font-size:2.2rem;
  filter:brightness(0.35) saturate(0.3);
  line-height:1;
}
.card-text{
  color:white;
  font-size:1.1rem;
  font-weight:900;
  line-height:1.7;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}

/* カード下のテキスト */
.oyasumi-title{
  font-size:1.9rem;
  font-weight:900;
  color:#222;
  margin-bottom:12px;
  letter-spacing:.02em;
}
.oyasumi-sub{
  font-size:1.1rem;
  color:#444;
  font-weight:600;
  line-height:1.6;
}

/* ========== ヘッダー ========== */
header{
  text-align:center;
  padding:14px 16px 8px;
  background:white;
  border-bottom:5px solid #ffb3d9;
  position:sticky;top:0;z-index:50;
  box-shadow:0 3px 12px rgba(255,100,180,.15);
}
.title{
  font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,#ff6ec7,#a855f7,#3b82f6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.06em;
}
.header-row{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 4px}
.score-item{
  background:#f5f8ff;border-radius:14px;padding:5px 14px;
  text-align:center;border:3px solid #c7d8ff;min-width:90px;
}
.score-label{font-size:.68rem;color:#999;font-weight:700}
.score-val{font-size:1.7rem;font-weight:900;color:#3b82f6;line-height:1.1}
.score-val.green{color:#22c55e}
.timer-box{
  background:#fff8e8;border-radius:14px;padding:5px 14px;
  text-align:center;border:3px solid #ffd080;min-width:90px;
}
.timer-label{font-size:.68rem;color:#999;font-weight:700}
.timer-val{font-size:1.7rem;font-weight:900;color:#f59e0b;line-height:1.1}
.timer-val.warn{color:#ef4444;animation:blink .5s step-start infinite}
@keyframes blink{50%{opacity:.3}}
.timer-bar-wrap{height:8px;background:#f0f0f0;border-radius:4px;margin:4px 2px 0;overflow:hidden}
.timer-bar{height:100%;background:linear-gradient(90deg,#4ade80,#fbbf24,#ef4444);border-radius:4px;transition:width 1s linear}

/* ========== コンテンツ ========== */
.content{padding:12px 14px 30px}
.start-btn{
  display:block;width:100%;padding:17px;
  background:linear-gradient(135deg,#4ade80,#22c55e);
  border:none;border-radius:22px;color:white;
  font-size:1.5rem;font-weight:900;cursor:pointer;
  margin-bottom:14px;
  box-shadow:0 6px 0 #16a34a,0 8px 20px rgba(34,197,94,.35);
  transition:transform .1s,box-shadow .1s;font-family:inherit;letter-spacing:.07em;
}
.start-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #16a34a}

.game-area{
  background:linear-gradient(180deg,#e4f3fc,#d8ecf8);
  border-radius:26px;border:5px solid #90caf9;
  position:relative;width:100%;height:1500px;overflow:hidden;
  box-shadow:inset 0 3px 12px rgba(144,202,249,.3);
}
.animal{
  position:absolute;font-size:88px;line-height:1;cursor:pointer;
  touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
  width:128px;height:128px;border-radius:50%;
  background:rgba(255,255,255,.65);box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:transform .12s;
}
.animal:active{transform:scale(1.25)}
@keyframes pop-out{
  0%{transform:scale(1);opacity:1}
  35%{transform:scale(1.6);opacity:1}
  100%{transform:scale(.1);opacity:0}
}
.animal.popping{animation:pop-out .42s cubic-bezier(.36,.07,.19,.97) forwards;pointer-events:none}

.instructions{
  background:white;border-radius:18px;padding:13px 16px;
  margin-top:13px;border:3px solid #f0e8ff;
}
.instructions p{
  font-size:.88rem;color:#666;margin-bottom:6px;
  display:flex;align-items:flex-start;gap:8px;line-height:1.5;
}
.instructions p:last-child{margin-bottom:0}

/* ========== クリア画面 ========== */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);z-index:200;
  align-items:center;justify-content:center;
}
.overlay.show{display:flex}
.clear-box{
  background:white;border-radius:32px;padding:38px 26px;
  text-align:center;max-width:300px;width:88%;
  border:6px solid #ffd700;box-shadow:0 0 50px rgba(255,215,0,.6);z-index:201;
}
.clear-emoji{font-size:4.5rem;display:block;margin-bottom:12px;animation:bounce-em .6s ease infinite alternate}
@keyframes bounce-em{from{transform:scale(1)}to{transform:scale(1.12)}}
.clear-title{font-size:2rem;font-weight:900;color:#ff6ec7;margin-bottom:6px}
.clear-sub{font-size:1rem;color:#888;margin-bottom:22px;line-height:1.6}
.retry-btn{
  display:block;width:100%;border:none;border-radius:18px;padding:14px;
  font-size:1.2rem;font-weight:900;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#f97316,#ef4444);
  color:white;box-shadow:0 4px 0 #b91c1c;
}
.retry-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b91c1c}

/* ========== 時間切れカード ========== */
.end-card{
  background:white;border-radius:28px;max-width:320px;width:90%;
  overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.35);z-index:201;
}
.end-sky{
  background:linear-gradient(180deg,#1a3a6a,#1e4880);
  padding:18px 18px 0;position:relative;min-height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
}
.end-bunny-wrap{position:relative;width:200px;height:120px;margin:0 auto -8px;animation:float-cloud 3s ease-in-out infinite alternate}
.end-bunny{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:3.8rem;line-height:1}
.end-bunny-cloud{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:8rem;line-height:1;filter:brightness(1.9) saturate(.15)}
.end-mt{position:absolute;bottom:0}
.end-mt1{width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:90px solid #1a4a25;left:50%;transform:translateX(-50%)}
.end-mt2{width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:75px solid #163d1f;right:8%}
.end-grass{background:linear-gradient(180deg,#1d5a28,#1a5025);padding:12px 16px 16px;text-align:center}
.end-grass-text{color:white;font-size:1.05rem;font-weight:900;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.4);margin-bottom:12px}
.end-bottom{padding:20px 20px 22px;text-align:center;background:white}
.end-title{font-size:1.7rem;font-weight:900;color:#222;margin-bottom:8px}
.end-sub{font-size:.95rem;color:#555;margin-bottom:16px;line-height:1.5}
.end-retry{
  background:linear-gradient(135deg,#60a5fa,#3b82f6);
  color:white;border:none;border-radius:16px;padding:12px 32px;
  font-size:1.1rem;font-weight:900;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 #1d4ed8;
}
.end-retry:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4ed8}

/* 紙吹雪 */
.confetti-piece{position:fixed;width:11px;height:11px;border-radius:2px;z-index:300;pointer-events:none}
@keyframes confetti-fall{
  0%{transform:translateY(-30px) rotate(0deg) scale(1);opacity:1}
  100%{transform:translateY(105vh) rotate(780deg) scale(.5);opacity:0}
}
</style>
</head>
<body>

<!-- ========== おやすみ画面 ========== -->
<div class="oyasumi-screen" id="oyasumi-screen">
  <div class="oyasumi-card">
    <!-- 夜空 -->
    <div class="card-sky">
      <!-- 星 -->
      <div class="c-star" style="top:8%;left:12%">⭐</div>
      <div class="c-star" style="top:6%;left:42%;animation-delay:.3s">⭐</div>
      <div class="c-star" style="top:16%;right:14%;animation-delay:.7s;font-size:1.4rem">⭐</div>
      <div class="c-star" style="top:32%;left:8%;animation-delay:.5s;font-size:1.3rem">⭐</div>
      <div class="c-star" style="top:42%;right:8%;animation-delay:.9s;font-size:1.5rem">⭐</div>
      <!-- ハート -->
      <div class="c-heart" style="top:10%;right:30%">🩷</div>
      <div class="c-heart" style="top:26%;left:30%;animation-delay:.6s">🩷</div>
      <div class="c-heart" style="top:38%;right:26%;animation-delay:1s;font-size:1rem">🩷</div>
      <!-- 雲 -->
      <div class="c-cloud" style="top:4%;right:8%">☁️</div>
      <div class="c-cloud" style="top:14%;left:4%;font-size:2rem;animation-delay:.8s">☁️</div>
      <!-- 山 -->
      <div class="mountains">
        <div class="mt1"></div>
        <div class="mt2"></div>
      </div>
      <!-- うさぎ -->
      <div class="bunny-wrap">
        <span class="bunny-cloud">☁️</span>
        <span class="bunny-emoji">🐰</span>
      </div>
      <!-- 木 -->
      <div class="card-trees">🌲🌲</div>
    </div>
    <!-- 草エリア -->
    <div class="card-grass">
      <div class="card-text">きょうはおしまい。<br>またいっしょにあそぼうね！</div>
    </div>
  </div>

  <!-- カード下テキスト -->
  <div class="oyasumi-title">おやすみ時間だよ</div>
  <div class="oyasumi-sub">朝7時から夜9時まで遊べるよ</div>
</div>

<!-- ========== ヘッダー ========== -->
<header>
  <div class="title">🐾 タップマルズ</div>
  <div class="header-row">
    <div class="score-item">
      <div class="score-label">🐾 みつけた</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">ぜんぶで</div>
      <div class="score-val green">10</div>
    </div>
    <div class="timer-box">
      <div class="timer-label">⏱ のこり</div>
      <div class="timer-val" id="timer-val">3:00</div>
    </div>
  </div>
  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timer-bar" style="width:100%"></div>
  </div>
</header>

<div class="content">
  <button class="start-btn" id="start-btn" onclick="startGame()">🎮 はじめる！</button>
  <div class="game-area" id="game-area"></div>
  <div class="instructions">
    <p>🐾 どうぶつを タップすると てんすうが はいるよ！</p>
    <p>📱 スクロールして ぜんぶ みつけてね</p>
    <p>⏱ 3ぷん で おしまいだよ</p>
  </div>
</div>

<!-- ========== クリア画面 ========== -->
<div class="overlay" id="clear-overlay">
  <div class="clear-box">
    <span class="clear-emoji">🎉</span>
    <div class="clear-title">やったー！</div>
    <div class="clear-sub">ぜんぶ みつけたよ！<br>すごい すごい！</div>
    <button class="retry-btn" onclick="resetGame()">🔄 もういちど</button>
  </div>
</div>

<!-- ========== 時間切れ画面 ========== -->
<div class="overlay" id="end-overlay">
  <div class="end-card">
    <div class="end-sky">
      <!-- 星・ハート・雲 -->
      <div class="c-star" style="top:10%;left:10%;font-size:1.4rem">⭐</div>
      <div class="c-star" style="top:8%;right:12%;font-size:1.2rem;animation-delay:.4s">⭐</div>
      <div class="c-star" style="top:28%;left:28%;font-size:1.5rem;animation-delay:.7s">⭐</div>
      <div class="c-star" style="top:20%;right:28%;font-size:1.2rem;animation-delay:.2s">⭐</div>
      <div class="c-star" style="top:38%;right:6%;font-size:1.3rem;animation-delay:.9s">⭐</div>
      <div class="c-heart" style="top:18%;left:38%">🩷</div>
      <div class="c-heart" style="top:34%;left:14%;animation-delay:.5s">🩷</div>
      <div class="c-cloud" style="top:5%;right:8%;font-size:2rem">☁️</div>
      <div class="c-cloud" style="top:22%;left:4%;font-size:1.7rem;animation-delay:.6s">☁️</div>
      <!-- 山 -->
      <div class="mountains">
        <div class="mt1"></div>
        <div class="mt2"></div>
      </div>
      <!-- パンダ -->
      <div class="end-bunny-wrap">
        <span class="end-bunny-cloud">☁️</span>
        <span class="end-bunny">🐼</span>
      </div>
    </div>
    <div class="end-grass">
      <div class="end-grass-text">きょうはもうおしまいだよ<br>またあしたね</div>
    </div>
    <div class="end-bottom">
      <div class="end-title">おしまいだよ</div>
      <div class="end-sub">みつけた：<span id="end-score">0</span> こ<br>またあした あそぼうね！</div>
      <button class="end-retry" onclick="resetGameEnd()">🔄 もういちど</button>
    </div>
  </div>
</div>

<script>
const ANIMALS = ['🐰','🐱','🐒','🐸','🐧'];
const TOTAL = 10;
const GAME_TIME = 180;
const PLAY_START = 7;
const PLAY_END = 21;

let score = 0, timerInterval = null, secondsLeft = GAME_TIME, gameRunning = false;

function checkTime() {
  const h = new Date().getHours();
  if (h < PLAY_START || h >= PLAY_END) {
    document.getElementById('oyasumi-screen').classList.add('show');
  } else {
    document.getElementById('oyasumi-screen').classList.remove('show');
  }
}

function startGame() {
  score = 0; secondsLeft = GAME_TIME; gameRunning = true;
  document.getElementById('score').textContent = '0';
  document.getElementById('start-btn').textContent = '🔄 もういちど';
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  placeAnimals();
}

function resetGame() {
  document.getElementById('clear-overlay').classList.remove('show');
  startGame();
}

function resetGameEnd() {
  document.getElementById('end-overlay').classList.remove('show');
  startGame();
}

function tickTimer() {
  secondsLeft--;
  updateTimerDisplay();
  if (secondsLeft <= 0) gameOver();
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
  const val = document.getElementById('timer-val');
  val.textContent = `${m}:${String(s).padStart(2,'0')}`;
  val.className = 'timer-val' + (secondsLeft <= 30 ? ' warn' : '');
  document.getElementById('timer-bar').style.width = (secondsLeft / GAME_TIME * 100) + '%';
}

function gameOver() {
  clearInterval(timerInterval); gameRunning = false;
  document.getElementById('end-score').textContent = score;
  document.getElementById('end-overlay').classList.add('show');
}

function placeAnimals() {
  const area = document.getElementById('game-area');
  area.innerHTML = '';
  const areaW = area.clientWidth || 440, areaH = 1500, size = 128, margin = 16;
  const placed = [];
  const list = [];
  for (let i = 0; i < TOTAL; i++) list.push(ANIMALS[i % ANIMALS.length]);
  list.sort(() => Math.random() - .5);
  for (const emoji of list) {
    let x, y, ok = false, attempts = 0;
    while (!ok && attempts < 300) {
      x = margin + Math.random() * (areaW - size - margin * 2);
      y = margin + Math.random() * (areaH - size - margin * 2);
      ok = placed.every(p => Math.abs(p.x - x) > size + 8 || Math.abs(p.y - y) > size + 8);
      attempts++;
    }
    placed.push({x, y});
    const el = document.createElement('div');
    el.className = 'animal';
    el.textContent = emoji;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    const tap = () => tapAnimal(el);
    el.addEventListener('click', tap);
    el.addEventListener('touchend', e => { e.preventDefault(); tap(); });
    area.appendChild(el);
  }
}

function tapAnimal(el) {
  if (!gameRunning || el.classList.contains('popping')) return;
  el.classList.add('popping');
  score++;
  document.getElementById('score').textContent = score;
  setTimeout(() => { el.remove(); if (score >= TOTAL) showClear(); }, 420);
}

function showClear() {
  clearInterval(timerInterval); gameRunning = false;
  document.getElementById('clear-overlay').classList.add('show');
  launchConfetti();
}

const COLORS = ['#ff6ec7','#ffd700','#4ade80','#60a5fa','#f97316','#a855f7','#f43f5e','#06b6d4'];
function launchConfetti() {
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `background:${COLORS[Math.floor(Math.random()*COLORS.length)]};left:${Math.random()*100}vw;top:-30px;border-radius:${Math.random()>.5?'50%':'2px'};animation:confetti-fall ${1.4+Math.random()*1.8}s ease-in forwards;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }, i * 28);
  }
}

checkTime();
setInterval(checkTime, 60000);
</script>
</body>
</html>
